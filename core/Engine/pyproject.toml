[project]
name = "bron-engine"
version = "0.2.2"
description = "Bron framework engine: keeps agents in sync across Claude Code and Codex"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "tomli-w>=1.0"]

[project.scripts]
bron = "bron.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bron"]
