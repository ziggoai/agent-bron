[project]
name = "bron-engine"
version = "0.8.7"
description = "Bron framework engine: keeps agents in sync across Claude Code and Codex"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "tomli-w>=1.0"]

[project.scripts]
bron = "bron.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pypdfium2>=4.30",
    "ocrmac>=1.0",
    "python-calamine>=0.2",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "trafilatura>=1.12",
    "fastembed>=0.4",
    "numpy>=1.26",
    "pillow>=10",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bron"]
